name: run Script
on: push
jobs: 
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: get code
              uses: actions/checkout@v3
            - name: setup node
              uses: actions/setup-node@v3
              with:
                node-version: '18'
            - name: install dependencies
              run: npm ci
            - name: run lint
              run: npm run lint
    test:
        runs-on: ubuntu-latest
        steps:
            - name: get code
              uses: actions/checkout@v3
            - name: setup node
              uses: actions/setup-node@v3
              with:
                node-version: '18'
            - name: install dependencies
              run: npm ci
            - name: run test
              run: npm run test
    build:
        runs-on: ubuntu-latest
        steps:
            - name: get code
              uses: actions/checkout@v3
            - name: setup node
              uses: actions/setup-node@v3
              with:
                node-version: '18'
            - name: install dependencies
              run: npm ci
            - name: run build
              run: npm run build